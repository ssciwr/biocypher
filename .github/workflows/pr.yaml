name: Tests and code quality checks for pull requests

on: [pull_request]

jobs:
  tests_and_code_quality:
    strategy:
      fail-fast: true
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.10", "3.11", "3.12"]
        neo4j-version: ["4.4-community", "5.26.28-community"]
        exclude:
          # Windows tests don't use the PostgreSQL/Neo4j Docker containers
          - os: "windows-latest"
            neo4j-version: "4.4-community"
          # https://github.com/biocypher/biocypher/issues/339
          - os: "macos-latest"
            neo4j-version: "4.4-community"
        include:
          # One Enterprise job, to keep the multi-database code path covered:
          # Community always downgrades away from it. Linux only, since the
          # other runners never start the Neo4j container, and one Python
          # version, since what differs is Neo4j's edition and not our code.
          # Runs under the Evaluation Licence; see .github/actions/test.
          - os: "ubuntu-latest"
            python-version: "3.12"
            neo4j-version: "5.26.28-enterprise"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
    #----------------------------------------------
    #  checkout repo and set-up python and uv
    #----------------------------------------------
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Setup Python and uv
      uses: ./.github/actions/setup
      with:
        PYTHON_VERSION: ${{ matrix.python-version }}
    #----------------------------------------------
    #       install dependencies
    #----------------------------------------------
    - name: Install dependencies
      uses: ./.github/actions/install
      with:
        PYTHON_VERSION: ${{ matrix.python-version }}

    #----------------------------------------------
    #      run tests and code quality checks
    #----------------------------------------------
    - name: Run tests
      uses: ./.github/actions/test
      with:
        NEO4J_VERSION: ${{ matrix.neo4j-version }}
